name: Verify website
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: python3 scripts/build_site.py
      - run: ./scripts/test_web_ui.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dynlex-website
          path: build/site
