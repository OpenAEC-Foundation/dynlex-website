name: Deploy website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: /var/www/dynlex.com
      RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - run: npm ci

      - name: Build release
        run: |
          set -euo pipefail
          python3 scripts/build_site.py --base "/releases/$RELEASE/" --output "$RUNNER_TEMP/site"
          test -f "$RUNNER_TEMP/site/compiler/dynlex_web.js"
          test -f "$RUNNER_TEMP/site/compiler/dynlex_web.wasm"
          python3 scripts/nginx_delivery.py --root "$DEPLOY_PATH" > "$RUNNER_TEMP/nginx.conf"

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deploy host
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload immutable release
        run: |
          set -euo pipefail
          test "$(basename "$DEPLOY_PATH")" = "dynlex.com"
          [[ "$RELEASE" =~ ^[0-9a-f]{40}$ ]]
          remote_incoming="$DEPLOY_PATH/.incoming-$RELEASE"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "rm -rf '$remote_incoming' && mkdir -p '$remote_incoming'"
          rsync -az --delete -e "ssh -p $DEPLOY_PORT" \
            "$RUNNER_TEMP/site/" "$DEPLOY_USER@$DEPLOY_HOST:$remote_incoming/"
          scp -P "$DEPLOY_PORT" scripts/publish_libraries.py \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.publish-libraries-$RELEASE.py"

      - name: Publish release atomically
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' RELEASE='$RELEASE' bash -s" <<'REMOTE'
          set -euo pipefail
          [[ "$RELEASE" =~ ^[0-9a-f]{40}$ ]]
          test "$(basename "$DEPLOY_PATH")" = "dynlex.com"
          incoming="$DEPLOY_PATH/.incoming-$RELEASE"
          release_path="$DEPLOY_PATH/releases/$RELEASE"
          test -f "$incoming/index.html"
          mkdir -p "$DEPLOY_PATH/releases"
          if [ -e "$release_path" ]; then
            diff -qr "$incoming" "$release_path"
            rm -rf "$incoming"
          else
            mv "$incoming" "$release_path"
          fi
          if [ "$(stat -c %a "$release_path")" != 755 ]; then
            echo "The release directory must have mode 0755 so nginx can read it." >&2
            exit 1
          fi
          python3 "$DEPLOY_PATH/.publish-libraries-$RELEASE.py" --root "$DEPLOY_PATH"
          rm "$DEPLOY_PATH/.publish-libraries-$RELEASE.py"
          touch "$release_path"
          ln -s "releases/$RELEASE" "$DEPLOY_PATH/current.next"
          mv -Tf "$DEPLOY_PATH/current.next" "$DEPLOY_PATH/current"
          REMOTE

      - name: Configure nginx caching
        run: |
          set -euo pipefail
          scp -P "$DEPLOY_PORT" "$RUNNER_TEMP/nginx.conf" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.nginx-$RELEASE.conf"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' RELEASE='$RELEASE' bash -s" <<'REMOTE'
          set -euo pipefail
          site_hostname="$(basename "$DEPLOY_PATH")"
          config_path="/etc/nginx/sites-available/$site_hostname"
          link_path="/etc/nginx/sites-enabled/$site_hostname"
          mv "$DEPLOY_PATH/.nginx-$RELEASE.conf" "$config_path"
          ln -sfn "$config_path" "$link_path"
          nginx -t
          systemctl reload nginx
          REMOTE

      - name: Verify public release
        run: |
          set -euo pipefail
          public_site="https://$(basename "$DEPLOY_PATH")"
          curl_options=(--fail --silent --show-error --retry 3 --retry-all-errors --max-time 15)
          homepage="$RUNNER_TEMP/dynlex-home.html"
          release_url="$public_site/releases/$RELEASE"
          curl "${curl_options[@]}" --output "$homepage" "$public_site/"
          if ! grep -Fq "src=\"/releases/$RELEASE/platform/start.js\"" "$homepage"; then
            echo "The public homepage did not reference release $RELEASE." >&2
            exit 1
          fi
          for asset in platform/start.js application.wasm; do
            curl "${curl_options[@]}" --head --output /dev/null "$release_url/$asset"
          done
          curl "${curl_options[@]}" --output /dev/null "$public_site/libraries/"
          catalog="$RUNNER_TEMP/dynlex-libraries.json"
          curl "${curl_options[@]}" --output "$catalog" "$public_site/libraries/index.json"
          python3 - "$catalog" > "$RUNNER_TEMP/dynlex-library-paths" <<'PY'
          import json,sys
          for library in json.load(open(sys.argv[1]))['libraries']:
              print(library['source']['url'])
          PY
          while IFS= read -r archive; do
            curl "${curl_options[@]}" --head --output /dev/null "$public_site$archive"
          done < "$RUNNER_TEMP/dynlex-library-paths"

      - name: Remove superseded deployment files
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' RELEASE='$RELEASE' bash -s" <<'REMOTE'
          set -euo pipefail
          test "$(basename "$DEPLOY_PATH")" = "dynlex.com"
          find "$DEPLOY_PATH" -mindepth 1 -maxdepth 1 \
            ! -name releases ! -name current ! -name libraries -exec rm -rf -- {} +
          find "$DEPLOY_PATH/releases" -mindepth 1 -maxdepth 1 -type d \
            ! -name "$RELEASE" -mmin +1440 -exec rm -rf -- {} +
          REMOTE
